# Render Blueprint for LabelLens (doc 08 production release).
# Deploy: Render dashboard → New + → Blueprint → select this repository.
services:
  - type: web
    name: labelens
    runtime: docker
    # Free plan spins down after idle (slow first scan). Upgrade to `starter`
    # for an always-on service with more RAM before real users arrive.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_NAME
        value: labelens
      - key: ALLOWED_ORIGINS
        # Exact HTTPS origin of the deployed app (no wildcard). Adjust if
        # Render assigns a different hostname than the default.
        value: https://labelens-lbzo.onrender.com
      - key: MONGODB_URI
        sync: false # set in the dashboard: Atlas SRV connection string
      - key: JWT_SECRET
        generateValue: true # random ≥32 chars, generated by Render
